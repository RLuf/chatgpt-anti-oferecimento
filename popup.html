<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 250px;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        h3 { margin-top: 0; text-align: center; }
        .status {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .emoji { font-size: 2em; }
    </style>
</head>
<body>
    <h3>🎯 Anti-Oferecimento</h3>
    <div class="status">
        <div class="emoji">✅</div>
        <p>Extensão ativa!</p>
        <small>Toda mensagem no ChatGPT receberá automaticamente "não me ofereça nada"</small>
    </div>
</body>
</html>
